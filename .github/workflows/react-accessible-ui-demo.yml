name: React accessible UI demo checks

on:
  pull_request:
    paths:
      - "showcase/react-accessible-ui/**"
      - ".github/workflows/react-accessible-ui-demo.yml"
  push:
    branches: [main]
    paths:
      - "showcase/react-accessible-ui/**"
      - ".github/workflows/react-accessible-ui-demo.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/react-accessible-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm run test
      - name: Type-check and build
        run: npm run build
