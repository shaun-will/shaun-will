[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-fastapi-rbac-demo"
version = "0.1.0"
description = "Portfolio demo of tenant-safe FastAPI permissions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "PyJWT>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
